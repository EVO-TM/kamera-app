<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>iPhone 4K Cam to OBS</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }

    /* OBS / Alıcı Ekranı (Tam ekran, kayıpsız) */
    .obs-view { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }

    /* iPhone & Menü Paneli */
    .container { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; text-align: center; }
    .card { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); padding: 24px; border-radius: 20px; max-width: 440px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
    
    h1 { font-size: 1.4rem; margin-bottom: 6px; font-weight: 800; color: #00f2fe; }
    p { font-size: 0.85rem; color: #aaa; margin-bottom: 16px; }

    .code-box { background: #0a0a0a; border: 2px dashed #00f2fe; border-radius: 12px; padding: 14px; font-size: 2.2rem; font-weight: 900; letter-spacing: 6px; color: #4facfe; margin-bottom: 12px; }
    .status-badge { display: inline-block; background: #1a2e1f; color: #00ff88; border: 1px solid #00ff88; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 15px; }

    .input-box { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #333; background: #151515; color: #fff; font-size: 1.1rem; text-align: center; margin-bottom: 12px; outline: none; text-transform: uppercase; letter-spacing: 2px; }
    
    .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); color: #000; }
    .btn-secondary { background: #222; color: #fff; border: 1px solid #444; }

    #localVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.4; }
  </style>
</head>
<body>

  <!-- Alıcı / OBS Ekranı -->
  <div id="receiverContainer" class="obs-view" style="display: none;">
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <!-- Menü Ekranı -->
  <div class="container" id="menuContainer">
    <div class="card" id="mainCard">
      <h1>iPhone 4K Web Kamerası</h1>
      <p>Yüksek Bitrate (25 Mbps) & 4K Ultra-HD Modu</p>
      <button class="btn btn-primary" onclick="startBroadcaster()">📱 iPhone (4K Kamera Başlat)</button>
      <div style="margin: 12px 0; color: #555; font-size: 0.8rem;">VEYA PC'DEN BAĞLAN</div>
      <input type="text" id="joinCodeInput" class="input-box" placeholder="6 HANELİ KOD">
      <button class="btn btn-secondary" onclick="startReceiver(document.getElementById('joinCodeInput').value)">🖥️ PC / OBS Ekranı Aç</button>
    </div>

    <!-- iPhone Yayın Ekranı -->
    <div class="card" id="senderCard" style="display: none;">
      <h1>YAYIN AKTİF 🔥</h1>
      <div class="status-badge" id="camResBadge">Kamera Ayarlanıyor...</div>
      <div class="code-box" id="displayCode">------</div>
      <p id="obsLink" style="font-size: 0.75rem; word-break: break-all; color: #00f2fe; margin-bottom: 12px;"></p>
      <button class="btn btn-secondary" onclick="switchCamera()">🔄 Kamerayı Çevir (Arka / Ön)</button>
    </div>
  </div>

  <video id="localVideo" autoplay playsinline muted style="display: none;"></video>

  <script>
    let localStream = null;
    let peer = null;
    let currentFacingMode = "environment"; // iPhone arka kamera ile 4K açılır
    let activeCall = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      if (code) startReceiver(code);
    });

    // 1. IPHONE 4K YAYIN
    async function startBroadcaster() {
      document.getElementById('mainCard').style.display = 'none';
      document.getElementById('senderCard').style.display = 'block';
      document.getElementById('localVideo').style.display = 'block';

      if ('wakeLock' in navigator) {
        try { await navigator.wakeLock.request('screen'); } catch(e){}
      }

      await init4KCamera();

      const randomCode = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('displayCode').innerText = randomCode;

      const obsURL = `${window.location.origin}${window.location.pathname}?code=${randomCode}`;
      document.getElementById('obsLink').innerText = "OBS Linki: " + obsURL;

      peer = new Peer('cam-stream-' + randomCode);

      peer.on('call', (call) => {
        activeCall = call;
        call.answer(localStream);

        // PC bağlandığı anda Bitrate sınırını kaldır (25 Mbps'e kilitle)
        boostBitrate(call.peerConnection);
      });
    }

    // 4K Kamera Başlatıcı
    async function init4KCamera() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
      }

      // 4K (3840x2160) Talep Et - 30 FPS Safari için çok daha net ve akıcıdır
      const constraints = {
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 3840, min: 1920 },
          height: { ideal: 2160, min: 1080 },
          frameRate: { ideal: 30, min: 24 }
        },
        audio: true
      };

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        const videoEl = document.getElementById('localVideo');
        videoEl.srcObject = localStream;

        // Gerçekte kaç piksel aldığımızı ekrana yazdıralım
        const track = localStream.getVideoTracks()[0];
        const settings = track.getSettings();
        document.getElementById('camResBadge').innerText = 
          `Aktif Kalite: ${settings.width || 1920}x${settings.height || 1080} @ 25 Mbps`;

      } catch (err) {
        alert("Kamera 4K modunda açılamadı, sistem 1080p fallback yapıyor: " + err.message);
      }
    }

    // WebRTC 25 Mbps Kalite Zorlaması (Ultra Low Compression)
    function boostBitrate(pc) {
      if (!pc) return;

      const setHighBitrate = async () => {
        const senders = pc.getSenders();
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender) {
          try {
            const params = videoSender.getParameters();
            if (!params.encodings || params.encodings.length === 0) {
              params.encodings = [{}];
            }
            // 25.000.000 bps = 25 Mbps (Stüdyo Kalitesi)
            params.encodings[0].maxBitrate = 25000000;
            // Çözünürlüğün asla düşmesine izin verme
            params.degradationPreference = 'maintain-resolution';
            await videoSender.setParameters(params);
            console.log("Ultra HD Bitrate (25 Mbps) aktif edildi!");
          } catch(e) {
            console.warn("Bitrate kilitleme uyarısı:", e);
          }
        }
      };

      // Bağlantı kurulduğu gibi ve 1 saniye sonra tekrar zorla
      pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
          setHighBitrate();
        }
      };
      setTimeout(setHighBitrate, 1200);
    }

    async function switchCamera() {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      await init4KCamera();
      if (activeCall && localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        const sender = activeCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
        if (sender) sender.replaceTrack(videoTrack);
      }
    }

    // 2. ALICI / OBS TARAFI
    function startReceiver(targetCode) {
      if (!targetCode) return;
      targetCode = targetCode.trim();

      document.getElementById('menuContainer').style.display = 'none';
      document.getElementById('localVideo').style.display = 'none';
      document.getElementById('receiverContainer').style.display = 'flex';

      const receiverPeer = new Peer();

      receiverPeer.on('open', () => {
        const canvas = document.createElement("canvas");
        canvas.width = 1; canvas.height = 1;
        const dummyStream = canvas.captureStream(1);

        const call = receiverPeer.call('cam-stream-' + targetCode, dummyStream);
        call.on('stream', (remoteStream) => {
          const video = document.getElementById('remoteVideo');
          video.srcObject = remoteStream;
          video.play();
        });
      });
    }
  </script>
</body>
</html>
